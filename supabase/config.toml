# Local only. Never link this checkout to a hosted project.
project_id = "stockshift-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 900
enable_signup = true
enable_anonymous_sign_ins = false
[auth.email]
enable_signup = true
enable_confirmations = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
