name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript workspace
        run: npm ci
      - name: Verify schemas, server types, contracts and web build
        run: npm run contracts:check && npm run typecheck && npm run test --workspaces && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.3'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
      - name: Install Python worker from lock
        working-directory: services/worker
        run: uv sync --locked
      - name: Verify Docker-backed local Supabase migrations, RLS, jobs and worker integration
        run: |
          npm run supabase:local -- start
          npm run supabase:local -- db reset --local
          npm run supabase:local -- db lint --local
          npm run test:local
      - name: Check Python
        working-directory: services/worker
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest
          uv run --locked stockshift-worker
          uv run --locked python -c "from stockshift_worker.extraction.base import DocumentExtractor"
          uv build --no-sources
      - name: Validate installed wheel outside repository
        working-directory: services/worker
        run: |
          uv venv /tmp/stockshift-wheel --python 3.11
          uv export --locked --no-dev --no-emit-project -o /tmp/stockshift-runtime.txt
          uv pip install --python /tmp/stockshift-wheel/bin/python --require-hashes -r /tmp/stockshift-runtime.txt
          uv pip install --python /tmp/stockshift-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/stockshift-wheel/bin/python -c "from stockshift_worker.contracts import validate_contract; validate_contract('job-status', {'schema_version': 'v1', 'job_id': '11111111-1111-4111-8111-111111111111', 'state': 'queued', 'stage': None, 'completed_units': 0, 'total_units': None, 'failure_code': None})"
      - name: Build CPU worker image and check credential-free smoke command
        run: |
          docker build -t stockshift-worker:ci services/worker
          docker run --rm stockshift-worker:ci
      - name: Check patch whitespace
        run: git show --format= --check HEAD
